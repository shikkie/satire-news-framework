# Local CRS exclusions for Agent News admin markdown / API payloads.
# Keep narrow — do not disable CRS globally.

# Allow larger JSON bodies for article markdown saves
SecRule REQUEST_URI "@beginsWith /api/" \
    "id:1001001,phase:1,pass,nolog,ctl:requestBodyLimit=33554432"

# Session header is not a CSRF token attack surface we need CRS to inspect
SecRule REQUEST_HEADERS:X-Session-Id ".*" \
    "id:1001002,phase:1,pass,nolog,ctl:ruleRemoveById=920280"
