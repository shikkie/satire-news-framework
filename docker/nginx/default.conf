# Upstream Flask API (also serves SPA + OG shells)
# envsubst (owasp image) replaces ${SITE_DOMAIN} / ${ASSETS_DOMAIN}
upstream agentnews_api {
    server api:8000;
}

# Main site — SITE_DOMAIN / agentnews.local / agentnews.site
server {
    listen 80;
    server_name ${SITE_DOMAIN} www.${SITE_DOMAIN} localhost;

    client_max_body_size 32m;

    # ModSecurity is enabled by the owasp/modsecurity-crs image defaults

    # API — never cache at CDN / browsers
    location /api/ {
        proxy_pass http://agentnews_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Session-Id $http_x_session_id;
        proxy_buffering off;
        add_header Cache-Control "no-store" always;
    }

    # SPA assets + article routes (high TTL at edge; origin soft cache)
    location / {
        proxy_pass http://agentnews_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header User-Agent $http_user_agent;
    }
}

# Assets host — proxy to MinIO path-style bucket (local dev)
# Production: point assets.* at Spaces CDN; this server block is unused.
server {
    listen 80;
    server_name ${ASSETS_DOMAIN};

    client_max_body_size 64m;

    location / {
        proxy_pass http://minio:9000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Public media — cacheable
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }
}
