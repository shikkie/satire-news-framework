# Agent News application stack (issue #14)
# Local: agentnews.local + assets.agentnews.local → this compose
# Prod:  same compose on DO droplet; swap .env for Spaces + Gcore credentials
#
#   cp .env.example .env
#   docker compose up -d --build
#   docker compose exec api python -m scripts.onboard_content

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  minio:
    # Docker Hub minio/minio was removed; Quay still publishes the community images.
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    volumes:
      - minio_data:/data
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    # Server image has neither curl nor mc; api waits on service_started + minio-init.

  minio-init:
    image: quay.io/minio/mc:latest
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      i=0;
      until mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD}; do
        i=$$((i+1));
        if [ $$i -gt 30 ]; then echo 'minio never became ready' >&2; exit 1; fi;
        sleep 1;
      done;
      mc mb -p local/$${S3_BUCKET} || true;
      mc anonymous set download local/$${S3_BUCKET} || mc anonymous set public local/$${S3_BUCKET} || true;
      exit 0;
      "
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-agentnews-media}
    restart: "no"

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Prefer .env (host Mongo on :27017, or compose service `mongo`)
      MONGO_URI: ${MONGO_URI:-mongodb://mongo:27017}
      MONGO_DB: ${MONGO_DB:-agentnews}
      S3_ENDPOINT_URL: http://minio:9000
      GROK_BIN: ${GROK_BIN:-/usr/local/bin/grok}
      GROK_CWD: /app
    volumes:
      # Live seed folders so onboard / CMS generate can read-write
      - ./articles:/app/seed/articles
      - ./articles:/app/articles
      - ./ads:/app/seed/ads:ro
      - ./skill:/app/skill:ro
      # Hot-edit API without rebuilding the image
      - ./api/app:/app/app
      - ./api/scripts:/app/scripts
      - ./api/wsgi.py:/app/wsgi.py
    ports:
      # Host port often cannot be 8000 (other local APIs). Override with API_PUBLISH_PORT.
      - "${API_PUBLISH_PORT:-8000}:8000"
    depends_on:
      mongo:
        condition: service_healthy
        required: false
      minio:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  nginx:
    image: owasp/modsecurity-crs:nginx-alpine
    restart: unless-stopped
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
    environment:
      # Paranoia / CRS tuning — detection-only is safer for first boot; raise later
      MODSEC_RULE_ENGINE: ${MODSEC_RULE_ENGINE:-DetectionOnly}
      BLOCKING_PARANOIA: ${BLOCKING_PARANOIA:-1}
      ANOMALY_INBOUND: ${ANOMALY_INBOUND:-10}
      ANOMALY_OUTBOUND: ${ANOMALY_OUTBOUND:-5}
      MODSEC_REQ_BODY_LIMIT: ${MODSEC_REQ_BODY_LIMIT:-33554432}
      MODSEC_REQ_BODY_NOFILES_LIMIT: ${MODSEC_REQ_BODY_NOFILES_LIMIT:-33554432}
      SITE_DOMAIN: ${SITE_DOMAIN:-agentnews.local}
      ASSETS_DOMAIN: ${ASSETS_DOMAIN:-assets.agentnews.local}
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/templates/conf.d/default.conf.template:ro
      - ./docker/nginx/modsecurity-override.conf:/etc/modsecurity.d/owasp-crs/rules/REQUEST-900-EXCLUSION-RULES-BEFORE-CRS.conf:ro
    depends_on:
      api:
        condition: service_healthy

volumes:
  mongo_data:
  minio_data:
